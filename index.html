        * {

        body {

            display: flex;

            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .panel {
            background: #060913;
            border: 2px solid #0044ff;
            box-shadow: 0 0 35px rgba(0, 68, 255, 0.5);
            border-radius: 16px;
            padding: 30px;
            width: 350px;
            text-align: center;
        }
        h2 {
            color: #00d2ff;
            margin-bottom: 5px;
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.7);
        }
        .sub-title {
            font-size: 11px;

            font-weight: bold;

            text-shadow: 0 0 8px rgba(255, 0, 85, 0.7);
        }
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            font-size: 12px;
            color: #00d2ff;
            font-weight: bold;
            display: block;
            margin-bottom: 6px;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            background: #0b101f;
            border: 1px solid #0044ff;
            color: #fff;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
            transition: 0.3s;
        }
        input[type="text"]:focus {
            border-color: #ff0055;
            box-shadow: 0 0 12px rgba(255, 0, 85, 0.6);
        }
        .btn {
            background: linear-gradient(135deg, #0044ff, #ff0055);
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 15px;
            transition: 0.3s;
            box-shadow: 0 0 15px rgba(0, 68, 255, 0.5);
        }
        .btn:hover {
            opacity: 0.9;
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.9);
        }
        .status {
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 13px;
            display: none;
        }
        .active {
            background: rgba(0, 255, 100, 0.15);
            border: 1px solid #00ff64;
            color: #00ff64;
            display: block;
            box-shadow: 0 0 12px rgba(0, 255, 100, 0.4);
        }
        .error {
            background: rgba(255, 0, 85, 0.15);
            border: 1px solid #ff0055;
            color: #ff0055;
            display: block;
            box-shadow: 0 0 12px rgba(255, 0, 85, 0.4);
        }
    </style>
</head>
